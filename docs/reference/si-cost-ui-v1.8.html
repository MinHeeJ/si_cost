      }

      /* 공통코드 그룹 목록은 따로 스크롤: 다시 그려도 스크롤 위치 유지 */
      {
        const _rp = renderPage;
        renderPage = function (...a) {
          const q = 'nav[aria-label="코드 그룹"]',
            n = document.querySelector(q),
            st = n ? n.scrollTop : null;
          const r = _rp.apply(this, a);
          const m = document.querySelector(q);
          if (m && st != null) m.scrollTop = st;
          return r;
        };
      }
      function tentSn(p, o) {
        return p.tent.sn != null && o.needs[p.tent.sn]
          ? p.tent.sn
          : Math.max(
              0,
              o.needs.findIndex((r) => r.job === (p.tent.job || p.job)),
            );
      }
      ACT.asgrec = () => {
        if (AS) {
          asgRead();
          if (recOk(AS.proj)) {
            REC.target = AS.proj;
            if (AS.job) REC.job = AS.job;
            const ps = PROJ_BY[AS.proj].start.slice(0, 7);
            REC.start =
              AS.start && AS.start.slice(0, 7) > ps ? AS.start.slice(0, 7) : ps;
          }
        }
        closeDrawer();
        go("UI-30");
      };

      /* ===== AI 인력 추천 [제외]: 이 대상의 추천에서 그 사람을 뺀다 (UI-30 「이 후보를 이번 추천에서 뺀다」, 사유 함께 기록) ===== */
      var REC_EXC = {};
      ACT.recexc = (a) => {
        const p = PEOPLE.find((x) => x.no === a.dataset.k);
        if (!p) return;
        openModal({
          title: `${p.name}님을 추천에서 뺄까요?`,
          body: `<div class="fc"><label for="exr" class="fl req" style="text-align:left;padding:0">제외 사유</label><select class="in" id="exr"><option>일정이 맞지 않음</option><option>본인 희망과 다름</option><option>고객 요청</option><option>기타</option></select><span class="help">이 자리·이 직무의 추천에서만 빠집니다. 직무를 바꾸거나 다른 자리를 고르면 다시 나옵니다.</span></div>`,
          buttons: [
            { l: "취소", fn: closeModal },
            {
              l: "제외",
              cls: "btn-d",
              fn: () => {
                (REC_EXC[REC.target + "|" + REC.job] =
                  REC_EXC[REC.target + "|" + REC.job] || {})[p.no] =
                  $("#exr").value;
                closeModal();
                renderPage();
                toast(
                  `${p.name}님을 이 자리(${JOBS[REC.job] || REC.job}) 추천에서 뺐습니다.`,
                );
              },
            },
          ],
        });
      };

      /* ===== 턴키 배분표 금액을 쓰는 공통 함수 (식-25·53: UI-03 개인 단가, UI-07 참고선, UI-04 월별 표) ===== */
      function tkPersonRev(pr, p, m, allocM) {
        const cur = distCur(pr.id);
        const row =
          cur && cur.rows.find((x) => x.kind === "사람" && x.name === p.name);
        if (row) return row.m[m] || 0;
        const tg = pr.budget || bdgtDef(pr.amt);
        return bw((allocM * pr.amt) / Math.max(1, tg));
      }
      function tkMonthRef(pr, m) {
        const cur = distCur(pr.id);
        if (cur) return cur.rows.reduce((s, x) => s + (x.m[m] || 0), 0);
        const r = projStats(pr);
        const tg = pr.budget || bdgtDef(pr.amt);
        return bw(((r.cost || 0) * pr.amt) / Math.max(1, tg));
      }

      /* ===== v1.6: 투입 배정이 바뀌면 재무·자금 숫자와 개발자 풀 상태를 다시 맞춘다 =====
   재무(PL·자금수지)는 처음 만든 예시 숫자에, 투입 배정에서 달마다 다시 계산한 매출·원가의 차이만 더한다.
   마감한 달은 마감할 때 숫자로 고정(마감 뒤 차이는 전월 조정). */
      var PLB = PL26.map((x) => ({ ...x }));
      function monAgg(m) {
        let rev = 0,
          alloc = 0,
          idle = 0,
          direct = 0,
          rd = 0;
        for (const p of PEOPLE) {
          if (retOut(p, m) || (p.hired && p.hired.slice(0, 7) > m)) continue;
          const c = costOf(p),
            emp = p.type === "정규직" || p.type === "계약직";
          let T = 0,
            ti = 0,
            tl = 0;
          for (const a of ASSIGN) {
            if (a.p !== p) continue;
            const mm = mmIn(a, m);
            if (!mm) continue;
            T += mm;
            const pr = PROJ_BY[a.proj];
            if (pr.type === "내부") ti += mm;
            else if (pr.status === "실주") tl += mm;
            else if (pr.type !== "턴키" && a.kind !== "무상지원")
              rev += revAt(a, m);
          }
          const w = Math.min(T, 1),
            si = T ? ti / T : 0,
            sl = T ? tl / T : 0;
          /* 사람마다 원 단위 버림, 끝자리는 마지막 줄(정규·계약직은 대기, 아니면 연구개발비)에 모음(식-57). 실주 프로젝트 몫은 대기 원가(식-16, 2026-10-30 B1) */ const li =
            bw(c.pc * w * sl);
          const ai = bw(c.pc * w * (1 - si - sl));
          const ri = emp || w < 1 ? bw(c.pc * w * si) : c.pc - ai - li;
          alloc += ai;
          rd += ri;
          idle += li;
          if (emp) idle += c.pc - ai - ri - li;
          if (T && p.type !== "외주")
            direct += bw((c.team + c.pexp) * Math.min(1, T / (c.T || 1)));
        }
        for (const pr of PROJ)
          if (
            pr.type === "턴키" &&
            !PNOREV(pr) &&
            pr.start.slice(0, 7) <= m &&
            pr.end.slice(0, 7) >= m
          )
            rev += tkMonthRef(pr, m);
        /* 추가 직접 경비(그 달 넣은 금액)도 매출원가 직접 경비에 더함(2026-10-28) */ if (
          typeof DEXP !== "undefined"
        )
          for (const id in DEXP)
            if (PROJ_BY[id] && PROJ_BY[id].type !== "내부")
              direct += dexpM(id, m);
        return { rev, alloc, idle, direct, rd };
      }
      const FIN0 = MONTHS.map(monAgg),
        FINK = ["rev", "alloc", "idle", "direct", "rd"],
        FRZ = {};
      MONTHS.forEach((m) => {
        if (m <= S.closedTo)
          FRZ[m] = { rev: 0, alloc: 0, idle: 0, direct: 0, rd: 0 };
      });
      function refreshFin() {
        MONTHS.forEach((m, i) => {
          let d;
          if (m <= S.closedTo) {
            if (!FRZ[m]) {
              const g = monAgg(m);
              FRZ[m] = {};
              FINK.forEach((k) => (FRZ[m][k] = g[k] - FIN0[i][k]));
            }
            d = FRZ[m];
          } else {
            delete FRZ[m];
            const g = monAgg(m);
            d = {};
            FINK.forEach((k) => (d[k] = g[k] - FIN0[i][k]));
          }
          const x = PL26[i],
            b = PLB[i];
          FINK.forEach((k) => (x[k] = Math.round(b[k] + d[k])));
          if (m > S.closedTo) {
            const R = finRows(m),
              G = (g) =>
                R.filter((r) => r.g === g).reduce(
                  (s, r) => s + (+r.amt || 0),
                  0,
                );
            x.sga = G("판관비");
            x.nin = G("영업외수익");
            x.nout = G("영업외비용");
          }
          x.cost = x.alloc + x.idle + x.direct;
          x.gross = x.rev - x.cost;
          x.sgaT = x.sga + x.indirect + x.rd;
          x.op = x.gross - x.sgaT + x.adj;
          x.opr = (x.op / x.rev) * 100;
          x.pre = x.op + x.nin - x.nout;
          x.net = x.pre - x.tax;
          x.netr = (x.net / x.rev) * 100;
        });
        recalcCF();
      }
      /* 개발자 풀의 상태·프로젝트·철수일을 투입 배정에서 다시 정함(명세서: 근무 상태는 배치로 자동 갱신). 휴직·퇴사는 그대로 */
      function syncPerson(p) {
        const L = ASSIGN.filter((a) => a.p === p && a.end >= TODAY).sort(
          (x, y) => y.end.localeCompare(x.end),
        );
        const a = L[0];
        if (a) {
          p.proj = a.proj;
          p.start = a.start;
          p.end = a.end;
          p.ext = a.ext;
          p.mm = r2(
            L.filter((x) => x.start <= TODAY).reduce((s, x) => s + x.mm, 0) ||
              a.mm,
          );
        } else {
          p.proj = null;
          p.start = null;
          p.end = null;
          p.ext = null;
          p.mm = 0;
        }
        if (p.status === "휴직" || p.status === "퇴사") return;
        p.status = !a
          ? "대기"
          : a.end.slice(0, 7) <= addM(BASE, 2)
            ? "철수예정"
            : "투입중";
      }
      const ASG0 = new Map(
        ASSIGN.map((a) => [
          a,
          a.end + "|" + a.start + "|" + a.mm + "|" + a.proj,
        ]),
      );
      function syncPeople() {
        const seen = new Set();
        for (const a of ASSIGN) {
          const k = a.end + "|" + a.start + "|" + a.mm + "|" + a.proj;
          if (ASG0.get(a) !== k) {
            seen.add(a.p);
            ASG0.set(a, k);
          }
        }
        for (const a of [...ASG0.keys()])
          if (!ASSIGN.includes(a)) {
            seen.add(a.p);
            ASG0.delete(a);
          }
        seen.forEach(syncPerson);
      }
      {
        const _rp = renderPage;
        renderPage = function () {
          syncPeople();
          refreshFin();
          return _rp.apply(this, arguments);
        };
      }
    </script>
  </body>
