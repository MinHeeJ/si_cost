<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
      .cn2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
        align-items: start;
      }
      @media (max-width: 640px) {
        .cn2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .cn2 .in {
        width: 100% !important;
      }
      .cn2 .row > .in {
        flex: 1;
        min-width: 0;
        width: auto !important;
      }
      .cn-mk {
        font-size: 12px;
      }
      .cn-mk.ok {
        color: var(--ok);
      }
      .cn-mk.warn {
        color: var(--warn);
      }
    </style>
    <style>
      /* 7 빨간 버튼 마우스 오버 */
      .btn.btn-d:hover {
        background: #991b1b;
        border-color: #991b1b;
        color: #fff;
      }
      .btn.btn-dt:hover {
        background: var(--bad-bg);
        color: var(--bad);
        border-color: var(--bad);
      }
      /* 4 파일 선택 */
      input[type="file"].in {
        height: auto;
        min-height: 40px;
        padding: 5px 8px;
        line-height: 28px;
        cursor: pointer;
      }
      input[type="file"].in::file-selector-button {
        height: 28px;
        margin-right: 10px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      input[type="file"].in::file-selector-button:hover {
        background: var(--hover);
      }
      /* 8 묶음 버튼 */
      .seg .btn + .btn {
        margin-left: -1px;
      }
      /* 팝업 내용이 길면 창 안에서 스크롤 */
      .modal-wrap .modal {
        max-height: calc(100vh - 32px);
      }
      .modal .mb {
        min-height: 0;
      }
      .modal .mh,
      .modal .mf {
        flex-shrink: 0;
      }
      /* 5 숨은 글자 */
      label.size {
        position: relative;
      }
    </style>
  </head>
  <body data-testid="si-cost-reference-screen">
    <title>SI 원가관리 화면 시안 v1.8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <style>
      /* 레이아웃: 헤더 56px + 왼쪽 2단 메뉴 240/64px + 화면 탭줄 + 제목줄 + 본문 (디자인 기준 정의서 2·11장) */
      :root {
        --primary: #1d4ed8;
        --primary-hover: #1e40af;
        --primary-text: #1d4ed8;
        --primary-bg: #eff6ff;
        --on-primary: #ffffff;
        --text: #111827;
        --text-sub: #4b5563;
        --text-dis: #9ca3af;
        --border: #d1d5db;
        --divider: #e5e7eb;
        --bg: #f9fafb;
        --surface: #ffffff;
        --head-bg: #f3f4f6;
        --ro-bg: #f3f4f6;
        --hover: #f3f4f6;
        --ok: #15803d;
        --ok-bg: #f0fdf4;
        --warn: #b45309;
        --warn-bg: #fffbeb;
        --bad: #b91c1c;
        --bad-bg: #fef2f2;
        --bad-solid: #b91c1c;
        --info: #0369a1;
        --info-bg: #f0f9ff;
        --lock: #4b5563;
        --lock-bg: #f3f4f6;
        --on-cell: #dbeafe;
        --end-cell: #fef3c7;
        --leave-cell: #d1d5db;
        --c1: #1d4ed8;
        --c2: #f59e0b;
        --c3: #10b981;
        --c4: #8b5cf6;
        --c5: #ec4899;
        --c6: #6b7280;
        --star: #f59e0b;
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.16);
        --scrim: rgba(17, 24, 39, 0.4);
        --font: "Pretendard", "Noto Sans KR", "Malgun Gothic",
          "Apple SD Gothic Neo", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --primary: #2563eb;
          --primary-hover: #1d4ed8;
          --primary-text: #93c5fd;
          --primary-bg: rgba(59, 130, 246, 0.16);
          --on-primary: #ffffff;
          --text: #e5e7eb;
          --text-sub: #a3aab6;
          --text-dis: #6b7280;
          --border: #3a404c;
          --divider: #2a2f39;
          --bg: #0e1116;
          --surface: #161a21;
          --head-bg: #1e232c;
          --ro-bg: #1e232c;
          --hover: #1e232c;
          --ok: #4ade80;
          --ok-bg: rgba(34, 197, 94, 0.14);
          --warn: #fbbf24;
          --warn-bg: rgba(245, 158, 11, 0.14);
          --bad: #f87171;
          --bad-bg: rgba(239, 68, 68, 0.14);
          --bad-solid: #dc2626;
          --info: #7dd3fc;
          --info-bg: rgba(14, 165, 233, 0.14);
          --lock: #a3aab6;
          --lock-bg: #252a33;
          --on-cell: rgba(59, 130, 246, 0.3);
          --end-cell: rgba(245, 158, 11, 0.28);
          --leave-cell: #3a404c;
          --c1: #60a5fa;
          --c2: #fbbf24;
          --c3: #34d399;
          --c4: #a78bfa;
          --c5: #f472b6;
          --c6: #9ca3af;
          --star: #fbbf24;
          --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4);
          --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
          --scrim: rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-text: #93c5fd;
        --primary-bg: rgba(59, 130, 246, 0.16);
        --on-primary: #ffffff;
        --text: #e5e7eb;
        --text-sub: #a3aab6;
        --text-dis: #6b7280;
        --border: #3a404c;
        --divider: #2a2f39;
        --bg: #0e1116;
        --surface: #161a21;
        --head-bg: #1e232c;
        --ro-bg: #1e232c;
        --hover: #1e232c;
        --ok: #4ade80;
        --ok-bg: rgba(34, 197, 94, 0.14);
        --warn: #fbbf24;
        --warn-bg: rgba(245, 158, 11, 0.14);
        --bad: #f87171;
        --bad-bg: rgba(239, 68, 68, 0.14);
        --bad-solid: #dc2626;
        --info: #7dd3fc;
        --info-bg: rgba(14, 165, 233, 0.14);
        --lock: #a3aab6;
        --lock-bg: #252a33;
        --on-cell: rgba(59, 130, 246, 0.3);
        --end-cell: rgba(245, 158, 11, 0.28);
        --leave-cell: #3a404c;
        --c1: #60a5fa;
        --c2: #fbbf24;
        --c3: #34d399;
        --c4: #a78bfa;
        --c5: #f472b6;
        --c6: #9ca3af;
        --star: #fbbf24;
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        --scrim: rgba(0, 0, 0, 0.6);
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 400 14px/20px var(--font);
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 700;
      }
      h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        text-wrap: balance;
      }
      h3 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      a {
        color: var(--primary-text);
      }
      button {
        font-family: inherit;
      }
      .sub {
        color: var(--text-sub);
      }
      .cap {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-sub);
      }
      .num,
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .neg {
        color: var(--bad);
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .ic {
        flex: none;
        display: block;
      }
      :focus-visible {
        outline: 2px solid var(--primary-text);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      /* 앱 틀 */
      #app {
        display: grid;
        grid-template-rows: 56px minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr);
        height: 100%;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--divider);
        position: relative;
        z-index: 30;
        min-width: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
      }
      .logo {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        background: var(--primary);
        color: var(--on-primary);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .month {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: 12px;
      }
      .hsp {
        flex: 1;
      }
      .body {
        display: flex;
        min-height: 0;
        position: relative;
      }
      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      #page {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* 버튼 */
      .btn {
        height: 36px;
        padding: 0 14px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: 500 14px/1 var(--font);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:disabled {
        color: var(--text-dis);
        cursor: not-allowed;
        background: var(--surface);
      }
      .btn-p {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
      }
      .btn-p:hover {
        background: var(--primary-hover);
      }
      .btn-p:disabled {
        background: var(--ro-bg);
        border-color: var(--border);
        color: var(--text-dis);
      }
      .btn-d {
        background: var(--bad-solid);
        border-color: var(--bad-solid);
        color: #ffffff;
      }
      .btn-dt {
        color: var(--bad);
      }
      .btn-t {
        border: 0;
        background: none;
        color: var(--primary-text);
        height: 28px;
        padding: 0 4px;
      }
      .btn-t:hover {
        background: none;
        text-decoration: underline;
      }
      .btn-sm {
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
      }
      .btn-ai {
        color: var(--primary-text);
        border-color: var(--primary-bg);
        background: var(--primary-bg);
      }
      .ibtn {
        width: 36px;
        height: 36px;
        border-radius: 4px;
        border: 0;
        background: none;
        color: var(--text-sub);
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        position: relative;
        flex: none;
      }
      .ibtn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .ibtn.sm {
        width: 28px;
        height: 28px;
      }
      .ibtn:disabled {
        color: var(--text-dis);
        cursor: default;
        background: none;
      }
      .dot {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--bad-solid);
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .umenu {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--text);
        font: 500 14px var(--font);
        cursor: pointer;
        white-space: nowrap;
      }
      .umenu:hover {
        background: var(--hover);
      }
      .star.on {
        color: var(--star);
      }
      .star.on svg {
        fill: currentColor;
      }

      /* 배지 */
      .b:not(tr) {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        vertical-align: middle;
      }
      .b-ok {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .b-warn {
        color: var(--warn);
        background: var(--warn-bg);
      }
      .b-bad {
        color: var(--bad);
        background: var(--bad-bg);
      }
      .b-info {
        color: var(--info);
        background: var(--info-bg);
      }
      .b-lock {
        color: var(--lock);
        background: var(--lock-bg);
      }
      .b-neutral {
        color: var(--text-sub);
        border: 1px solid var(--border);
        background: transparent;
      }

      /* 입력 */
      .in {
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 10px;
        background: var(--surface);
        color: var(--text);
        font: 400 14px var(--font);
        min-width: 0;
        max-width: 100%;
      }
      .in:focus {
        outline: none;
        border-color: var(--primary-text);
        box-shadow: 0 0 0 1px var(--primary-text);
      }
      .in-sm {
        height: 28px;
        font-size: 13px;
        padding: 0 6px;
      }
      .in.money {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .in[readonly],
      .in:disabled {
        background: var(--ro-bg);
        color: var(--text-sub);
      }
      .in.err {
        border-color: var(--bad);
      }
      textarea.in {
        height: auto;
        min-height: 76px;
        padding: 8px 10px;
        line-height: 20px;
        resize: vertical;
        width: 100%;
      }
      select.in {
        padding-right: 4px;
      }

      /* 메뉴 */
      .nav {
        width: 240px;
        flex: none;
        border-right: 1px solid var(--divider);
        background: var(--surface);
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
      }
      .nav-quick {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--divider);
        margin-bottom: 4px;
      }
      .nq-t {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-sub);
        padding: 8px 12px 4px;
      }
      .nq-empty {
        font-size: 12px;
        color: var(--text-sub);
        padding: 2px 12px 4px;
      }
      .nav-tree {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-g .g {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 10px;
        border: 0;
        background: none;
        color: var(--text);
        font: 500 14px var(--font);
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
      }
      .nav-g .g:hover {
        background: var(--hover);
      }
      .nav-g .g .chev {
        margin-left: auto;
        color: var(--text-sub);
      }
      .nav-g.has-active > .g {
        color: var(--primary-text);
      }
      .nav-g .g.on {
        background: var(--primary-bg);
        font-weight: 600;
      }
      .nav-items {
        display: none;
        flex-direction: column;
        gap: 2px;
        padding: 2px 0 6px;
      }
      .nav-g.open .nav-items {
        display: flex;
      }
      .ni {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 36px;
        padding: 6px 10px 6px 39px;
        color: var(--text-sub);
        text-decoration: none;
        border-radius: 4px;
        border-left: 3px solid transparent;
      }
      .ni:hover {
        background: var(--hover);
        color: var(--text);
      }
      .ni.on {
        color: var(--primary-text);
        background: var(--primary-bg);
        border-left-color: var(--primary-text);
        font-weight: 600;
      }
      .ni.qk {
        padding-left: 12px;
      }
      .nb {
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--bad-bg);
        color: var(--bad);
        font-size: 12px;
        font-weight: 600;
        display: inline-grid;
        place-items: center;
      }
      .nb.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .nav-coll {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px;
        border: 0;
        background: none;
        color: var(--text-sub);
        border-radius: 4px;
        cursor: pointer;
        font: 400 13px var(--font);
      }
      .nav-coll:hover {
        background: var(--hover);
      }
      .fly-t {
        display: none;
      }
      .collapsed .nav {
        width: 64px;
        overflow: visible;
        padding: 8px 6px;
      }
      .collapsed .nav .lbl,
      .collapsed .nav-quick {
        display: none;
      }
      .collapsed .nav-g {
        position: relative;
      }
      .collapsed .nav-g .g {
        justify-content: center;
        padding: 0;
      }
      .collapsed .nav-g:hover .nav-items,
      .collapsed .nav-g:focus-within .nav-items {
        display: flex;
        position: absolute;
        left: 56px;
        top: 0;
        width: 220px;
        background: var(--surface);
        border: 1px solid var(--divider);
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
        padding: 8px;
        z-index: 40;
      }
      .collapsed .fly-t {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-sub);
        padding: 2px 10px 6px;
      }
      .collapsed .ni {
        padding-left: 10px;
      }
      .collapsed .nav-coll {
        justify-content: center;
        padding: 0;
      }
      .navscrim {
        display: none;
      }

      /* 화면 탭 · 제목줄 */
      .tabbar {
        display: flex;
        gap: 2px;
        padding: 6px 16px 0;
        border-bottom: 1px solid var(--divider);
        background: var(--surface);
        overflow-x: auto;
        flex: none;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        padding: 0 4px 0 12px;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        white-space: nowrap;
        font-size: 13px;
      }
      .tab a {
        color: var(--text-sub);
        text-decoration: none;
        padding-right: 8px;
      }
      .tab.on {
        background: var(--bg);
        border-color: var(--divider);
        margin-bottom: -1px;
      }
      .tab.on a {
        color: var(--text);
        font-weight: 600;
      }
      .tx {
        width: 22px;
        height: 22px;
        border: 0;
        background: none;
        border-radius: 4px;
        color: var(--text-sub);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .tx:hover {
        background: var(--hover);
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 24px 0;
        flex-wrap: wrap;
      }
      .tb-l {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .crumb {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-sub);
      }
      .tt {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .sid {
        font-size: 12px;
        color: var(--text-sub);
        margin-left: 4px;
      }
      .tb-r {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .content {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        flex: 1;
        min-width: 0;
      }

      /* 카드 · 요약 */
      .card {
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--surface);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .card-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
      }
      .kpi {
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--surface);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        color: var(--text);
        font-family: inherit;
        min-width: 0;
      }
      button.kpi {
        cursor: pointer;
      }
      button.kpi:hover {
        border-color: var(--border);
      }
      .kpi .l {
        font-size: 13px;
        color: var(--text-sub);
      }
      .kpi .v {
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .kpi .d {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-sub);
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .split {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 24px;
      }

      /* 배너 */
      .banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        flex-wrap: wrap;
      }
      .banner .btn {
        margin-left: auto;
      }
      .banner > span {
        flex: 1 1 240px;
        min-width: 0;
      }
      .db > * {
        flex-shrink: 0;
      }
      .db .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .t td.wrap {
        white-space: normal;
        min-width: 220px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .banner.lock {
        background: var(--lock-bg);
        color: var(--lock);
      }
      .banner.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .banner.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .banner.info {
        background: var(--info-bg);
        color: var(--info);
      }

      /* 조회 조건 */
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--surface);
      }
      .filters .f {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .filters .f label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-sub);
        white-space: nowrap;
      }
      .filters .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .fl-toggle {
        display: none;
      }

      /* 표 */
      .tbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: -12px;
      }
      .tbar .tl,
      .tbar .tr {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .twrap {
        overflow: auto;
        max-height: min(64vh, 680px);
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--surface);
      }
      .twrap.free {
        max-height: none;
      }
      table.t {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 13px;
        line-height: 20px;
        font-variant-numeric: tabular-nums;
      }
      .t th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--head-bg);
        font-weight: 600;
        text-align: left;
        height: 40px;
        padding: 0 12px;
        border-bottom: 1px solid var(--divider);
        white-space: nowrap;
        user-select: none;
      }
      .t th[data-act] {
        cursor: pointer;
      }
      .t th[data-act]:hover {
        color: var(--primary-text);
      }
      .t td {
        height: 40px;
        padding: 0 12px;
        border-bottom: 1px solid var(--divider);
        white-space: nowrap;
        background: var(--surface);
      }
      .t.dense td,
      .t.dense th {
        height: 32px;
      }
      .t tbody tr[data-act] {
        cursor: pointer;
      }
      .t tbody tr:hover td {
        background: var(--hover);
      }
      .t tbody tr.sel td {
        background: var(--primary-bg);
      }
      .t tbody tr.hl td {
        background: var(--warn-bg);
      }
      .t tfoot td {
        position: sticky;
        bottom: 0;
        z-index: 2;
        background: var(--head-bg);
        font-weight: 700;
        border-top: 2px solid var(--border);
        border-bottom: 0;
      }
      .t .num {
        text-align: right;
      }
      .t .ctr {
        text-align: center;
      }
      .t .sc {
        position: sticky;
        left: 0;
        z-index: 1;
        border-right: 1px solid var(--divider);
      }
      .t th.sc,
      .t tfoot td.sc {
        z-index: 3;
      }
      .t td.cur,
      .t th.cur {
        background: var(--primary-bg);
      }
      .t tr.b td {
        font-weight: 700;
      }
      .t tr.grp td {
        background: var(--head-bg);
        font-weight: 600;
      }
      .t td.ind {
        padding-left: 28px;
        color: var(--text-sub);
      }
      .t .chk {
        width: 40px;
        text-align: center;
        padding: 0;
      }
      .t input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--primary);
      }
      .pname {
        display: flex;
        flex-direction: column;
        line-height: 18px;
      }
      .pname small {
        font-size: 12px;
        color: var(--text-sub);
      }
      .lnk {
        color: var(--primary-text);
        text-decoration: none;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
      }
      .lnk:hover {
        text-decoration: underline;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bar .track {
        width: 90px;
        height: 6px;
        border-radius: 3px;
        background: var(--divider);
        overflow: hidden;
      }
      .bar .fill {
        height: 100%;
        background: var(--c1);
      }
      .bar .fill.warn {
        background: var(--c2);
      }
      .bar .fill.bad {
        background: var(--bad);
      }
      .unitsel {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-sub);
      }
      .fx summary {
        cursor: pointer;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .fx .t {
        table-layout: fixed;
        width: 100%;
      }
      .fx .t th,
      .fx .t td {
        white-space: normal;
        word-break: keep-all;
      }
      .fx .t td {
        vertical-align: middle;
        padding-top: 8px;
        padding-bottom: 8px;
        line-height: 20px;
      }
      .fx .t td:first-child {
        font-weight: 600;
      }
      .fx .eq {
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .fx .eq b {
        color: var(--primary, #2563eb);
        font-weight: 600;
      }
      @media (max-width: 767px) {
        .fx .t,
        .fx .t tbody,
        .fx .t tr,
        .fx .t td {
          display: block;
          width: auto !important;
        }
        .fx .t thead {
          display: none;
        }
        .fx .t tr {
          padding: 10px 12px;
          border-bottom: 1px solid var(--border);
        }
        .fx .t td {
          border: 0 !important;
          padding: 2px 0 !important;
          height: auto;
        }
        .fx .t td.cap {
          margin-top: 2px;
        }
      }
      .mstrip {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 2px 6px;
        scrollbar-width: thin;
      }
      .mchip {
        flex: 0 0 auto;
        min-width: 76px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      .mchip:hover:not(:disabled) {
        background: var(--hover);
      }
      .mchip.on {
        border-color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
        background: var(--primary-bg);
      }
      .mchip .s {
        font-size: 11px;
        line-height: 14px;
        color: var(--text-sub);
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .mchip:disabled {
        cursor: not-allowed;
        color: var(--text-dis);
        background: var(--fill);
      }
      .mchip.cl .s {
        color: var(--lock);
      }
      .mchip.wk .s {
        color: var(--info);
      }
      .taxrow td {
        background: var(--ro-bg);
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      @media (max-width: 1279px) {
        .grid3 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 767px) {
        .grid2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .ynav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ynav strong {
        font-size: 16px;
        min-width: 64px;
        text-align: center;
      }
      @media (max-width: 767px) {
        .month [data-act="mprev"],
        .month [data-act="mnext"] {
          display: none;
        }
        .month .in-sm {
          padding-left: 4px;
          padding-right: 0;
          font-size: 13px;
        }
        .month {
          gap: 4px;
        }
      }
      @media (max-width: 380px) {
        .month .b {
          display: none;
        }
      }
      .pbar {
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
      }
      .pbar .pf {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-sub);
      }
      .seg {
        display: inline-flex;
        gap: 0;
      }
      .seg .btn {
        border-radius: 0;
      }
      .seg .btn:first-child {
        border-radius: 6px 0 0 6px;
      }
      .seg .btn:last-child {
        border-radius: 0 6px 6px 0;
        margin-left: -1px;
      }
      .subcol > .pager {
        margin-top: -4px;
      }
      .dgrid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      @media (max-width: 1279px) {
        .dgrid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .witem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 4px;
        border: 0;
        border-top: 1px solid var(--divider);
        background: none;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        width: 100%;
      }
      .witem:hover {
        background: var(--hover);
      }
      .witem .wt {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .witem .wt .cap {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .witem .wgo {
        display: flex;
        align-items: center;
        gap: 2px;
        white-space: nowrap;
      }
      .kv2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .kv2 > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .kv2 strong {
        font-size: 18px;
      }
      @media (max-width: 767px) {
        .witem .wgo {
          display: none;
        }
      }
      @media (max-width: 767px) {
        .dash .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .dash .kpi {
          padding: 12px;
        }
        .dash .kpi .v {
          font-size: 20px;
        }
        .dash .kpi:last-child {
          grid-column: 1/-1;
        }
      }
      .note {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-sub);
      }

      /* 페이지 */
      .pager {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        margin-top: -12px;
      }
      .pages {
        display: flex;
        gap: 2px;
      }
      .pg {
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border-radius: 4px;
        border: 0;
        background: none;
        color: var(--text);
        cursor: pointer;
        font: 500 13px var(--font);
        font-variant-numeric: tabular-nums;
      }
      .pg:hover {
        background: var(--hover);
      }
      .pg.on {
        background: var(--primary);
        color: var(--on-primary);
      }
      .pg:disabled {
        color: var(--text-dis);
        cursor: default;
        background: none;
      }
      .pager .size {
        justify-self: end;
      }
      .cards {
        display: none;
      }
      .more {
        display: none;
      }

      /* 상세 창 · 확인 창 · 알림 */
      .scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 49;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(600px, 100%);
        background: var(--surface);
        box-shadow: var(--shadow-lg);
        z-index: 50;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .dh {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px 24px;
        border-bottom: 1px solid var(--divider);
      }
      .dt {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .da {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 0 24px;
        border-bottom: 1px solid var(--divider);
        overflow-x: auto;
        flex: none;
      }
      .tabs .tb {
        height: 40px;
        padding: 0 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-sub);
        font: 500 14px var(--font);
        cursor: pointer;
        white-space: nowrap;
      }
      .tabs .tb.on {
        color: var(--primary-text);
        border-bottom-color: var(--primary-text);
        font-weight: 600;
      }
      .content > .tabs {
        padding: 0;
        margin-bottom: -8px;
      }
      .db {
        flex: 1;
        overflow: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .df {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 24px;
        border-top: 1px solid var(--divider);
      }
      .kv {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 10px 16px;
        font-size: 14px;
      }
      .kv dt {
        color: var(--text-sub);
        font-size: 13px;
      }
      .kv dd {
        margin: 0;
      }
      .modal-wrap {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .modal {
        width: min(400px, 100%);
        max-height: calc(100% - 32px);
        background: var(--surface);
        border-radius: 8px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
      }
      .modal.wide {
        width: min(720px, 100%);
      }
      .mh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 8px 24px;
      }
      .mb {
        padding: 4px 24px 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: var(--text-sub);
      }
      .mf {
        display: flex;
        gap: 8px;
        padding: 12px 24px 20px;
        align-items: center;
      }
      .mf .r {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .toasts {
        position: fixed;
        top: calc(64px + env(safe-area-inset-top, 0px));
        right: 16px;
        z-index: 70;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 240px;
        max-width: min(380px, calc(100vw - 32px));
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--divider);
        box-shadow: var(--shadow-lg);
        font-size: 14px;
        animation: tin 0.18s ease-out;
      }
      .toast.ok svg {
        color: var(--ok);
      }
      .toast.info svg {
        color: var(--info);
      }
      @keyframes tin {
        from {
          transform: translateY(-6px);
          opacity: 0.4;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .pop-anchor {
        position: relative;
      }
      .pop {
        position: absolute;
        right: 0;
        top: 44px;
        width: 340px;
        max-width: calc(100vw - 32px);
        background: var(--surface);
        border: 1px solid var(--divider);
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
        z-index: 45;
        display: flex;
        flex-direction: column;
      }
      .pop-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--divider);
        font-weight: 600;
      }
      .pop-i {
        display: flex;
        gap: 10px;
        padding: 10px 14px;
        border: 0;
        border-bottom: 1px solid var(--divider);
        background: none;
        text-align: left;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        width: 100%;
      }
      .pop-i:hover {
        background: var(--hover);
      }
      .pop-i.unread {
        background: var(--primary-bg);
      }
      .pop-i:last-child {
        border-bottom: 0;
      }
      .pop.small {
        width: 220px;
      }

      /* 폼 */
      .fsec {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .fgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 24px;
      }
      .htool {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .htool .chips {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .htool button.chip {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 14px;
        font: inherit;
        font-size: 12px;
      }
      .htool button.chip.on {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      tr.muted td {
        color: var(--text-sub);
        text-decoration: line-through;
      }
      tr.muted td:last-child,
      tr.muted td:nth-child(2) {
        text-decoration: none;

        if (v <= 0) return 1;
        const p = 10 ** Math.floor(Math.log10(v));

        const mx = niceMax(Math.max(...vals) * 1.05);
        const mn = Math.min(0, ...vals);
        const y = (v) => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn)),
          x = (i) =>

            (W - pl - pr) *
              (labels.length === 1 ? 0.5 : i / (labels.length - 1));
        let g = "";
        for (let k = 0; k <= 4; k++) {

          g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;

        for (const s of series) {

      /* 인력 운영 보드 (유형 E) */
      let BOARD_M = Array.from({ length: 12 }, (_, k) => addM(BASE, k - 3));
      function cellInfo(p, m) {

        const mm = list.reduce((s, a) => s + a.mm, 0);
        if (!list.length) {
          /* SFR-128-03: 가배정 판정이 대기보다 먼저, 지난 달은 비어 있음으로 칠하지 않음(Q-28-4) */ if (

        return {

          body:
            `<div class="kpis">${kpi("지금 비어 있는 인원", cnt(BASE, "idle") + "명", "남는 MM " + free(BASE).toFixed(1) + " (일부 투입 포함)")}${kpi("3개월 안 철수 예정", PEOPLE.filter((p) => p.status === "철수예정").length + "명", "연장 가능성 높음 " + PEOPLE.filter((p) => p.ext === "높음").length + "명", "UI-05")}${kpi("동시 투입", multiN + "명", `이번 달 2건 이상 · 1.0 초과 ${PEOPLE.filter((p) => cellInfo(p, BASE).mm > 1).length}명`, "UI-12")}${kpi("3개월 뒤 남는 MM", free(addM(BASE, 3)).toFixed(1), badge("예측", "info"))}</div><div class="tabs" role="tablist">${["달력", "수요·공급"].map((x, i) => `<button class="tb${i === view ? " on" : ""}" role="tab" aria-selected="${i === view}" data-act="bdview" data-i="${i}">${x}</button>`).join("")}</div>` +
            (view === 0

              : `<div class="banner info">${ic("info", 16)} 가용 = 사람마다 (1 − 그 달 투입 MM)의 합. 철수한 투입은 연장 가능성(높음 80%·보통 50%·낮음 0%)만큼 남는다고 봅니다. 필요 = 영업 기회의 필요 인력 × 단계 확률 + 진행 프로젝트 미충원.</div>${supTable}`),

      function unfilled() {
        let PL;

        const f1 = addM(BASE, 1),
          U = {};
        for (const p of PROJ) {
          if (p.status !== "진행" || p.type === "내부" || !PL[p.id]) continue;
          const s0 = p.start.slice(0, 7),
            e0 = p.end.slice(0, 7),
            f0 = f1 > s0 ? f1 : s0;
          if (e0 < f0) continue;
          const n = mBetween(f0, e0) + 1;
          const act = {};
          ASSIGN.filter((a) => a.proj === p.id).forEach(
            (a) =>
              (act[a.job] =
                (act[a.job] || 0) +
                monthsOf(a.start, a.end).reduce((s, m) => s + mmIn(a, m), 0)),
          );
          for (const [j, v] of Object.entries(PL[p.id])) {
            if (v === "" || v == null) continue;
            const gap = Math.max(0, +v - (act[j] || 0));
            if (gap > 0)

          }
        }
        return U;

      function sdTotTable(fc) {

      }
      function forecast(msIn, prOv) {
        const ms = msIn || [0, 1, 2, 3, 4, 5].map((k) => addM(BASE, k));
        const PX = { 높음: 0.8, 보통: 0.5, 낮음: 0 };
        const res = {};
        const UF = unfilled();
        for (const j of Object.keys(JOBS)) {

            let un = 0;
            for (const u of UF[j] || [])
              if (m >= u.f0 && m <= u.e0) un += u.per;
            dem += un;
            return {
              m,
              sup: Math.round(sup * 10) / 10,
              dem: Math.round(dem * 10) / 10,
              un: Math.round(un * 10) / 10,
            };
          });
        }
        return { ms, res };
      }
      SCR["UI-17"] = () => {
        const fc = forecast(yMonths(S.year).filter((m) => m >= BASE));

            { fmt: (v) => v.toFixed(0), fit: true },
          )}</section>${sdTotTable(fc)}<p class="note">표는 직무를 나누지 않은 전체 사람 수입니다(MM 합). 차이 = 가용 − 필요, 빨간색은 부족(사람을 구해야 함), 주황색은 남음(잉여 인력)입니다. 필요 인력 = 진행 중 영업 기회(수주 확률 반영) + 진행 프로젝트 미충원(인원 계획의 계획 MM − 배정 MM을 다음 달부터 종료 달까지 나눈 값). 달별 미충원: ${fc.ms.map((m, k) => +m.slice(5) + "월 " + tot[k].un.toFixed(1)).join(" · ")}명.</p>`,
        };

      SCR["UI-29"] = () => {
        if (S.oform) return oppFormView();
        const view = S.sub["UI-29v"] || 0;
        const live = OPPS.filter((o) => o.status === "진행");
        const closedAll = OPPS.filter((o) => o.status !== "진행");
        const closed = closedAll.filter(
          (o) => S.oppStop || o.status !== "사용 안 함",

        const fmt = (v) => kor(v);

      function waterfall(steps, { h = 280 } = {}) {

      const GRADES = ["초급", "중급", "고급", "특급"];
      function nextSlots(a) {
        const p = a.p,

        const out = [];
        OPPS.filter((o) => o.status === "진행").forEach((o) =>

            const rel =
              r.job === p.job
                ? 40

                  ? 20
                  : 0;
            if (!rel) return;
            if (addM(r.start, r.months - 1) < from) return;
            const gap = Math.max(0, mBetween(from, r.start));
            if (gap > 3) return;
            /* 2026-10-30: 남은 자리는 가배정 자리 번호(TB_SL_TENT_ASGN.NEED_SN)로 센다 — 다른 직무 사람을 넣은 자리도 줄어듦 */ const taken =
              PEOPLE.filter(
                (q) =>
                  q !== p &&
                  q.tent &&
                  q.tent.opp === o.id &&
                  tentSn(q, o) === ri,
              ).length;
            if (taken >= r.n) return;
            const gd = Math.abs(
              GRADES.indexOf(p.grade) - GRADES.indexOf(r.grade || "중급"),
            );
            const gs = gd === 0 ? 20 : gd === 1 ? 10 : 0;
            const cust = pr0 && pr0.cust === o.cust ? 10 : 0;
            const pr = o.prob >= 60 ? 5 : 0;
            const score = aiRecommendScore([
              ["직무", rel, 40],
              ["등급", gs, 20],
              ["공백", [25, 15, 8, 3][gap], 25],
              ["고객사", cust, 10],
              ["수주확률", pr, 5],
            ]);
            const why = [
              rel === 40 ? "직무 일치" : "관련 직무",
              gd === 0
                ? "등급 일치"
                : gd === 1
                  ? "등급 한 단계 차이"
                  : "등급 차이 큼",
              gap === 0 ? "공백 없음" : `공백 ${gap}개월`,
            ];
            if (cust) why.push("같은 고객사");
            if (pr) why.push(`수주 확률 ${o.prob}%`);
            const st = r.start < from ? from : r.start;
            out.push({

              r,
              score,
              why,
              gap,
              waitD: Math.max(0, dGap(a.end, st + "-01") - 1),
              left: r.n - taken,
            });
          }),
        );
        return out
          .sort(
            (x, y) => y.score - x.score || x.r.start.localeCompare(y.r.start),

      function EXTRA_WARNS(MODE = "all") {
        const W = [];
        /* 법인세는 회사 전체 일이라 파트장·PM에게는 안 보임(SFR-116-08: 파트장 확인할 일은 자기 파트, 자금 숨김) */ const tpc =
          MODE !== "all"
            ? []
            : TAXPAY.filter((t) => taxState(t) === "확인 필요");
        if (tpc.length)
          W.push([
            "bad",
            `법인세 납부 확인 필요 ${tpc.length}건`,
            tpc
              .map(
                (t) =>
                  `${t.kind}(${t.date}) — 실제 낸 금액을 [납부 확인]으로 넣어 주세요`,
              )
              .join(" · "),
            "UI-10",
            "재무 항목",
          ]);
        const pm = PROJ.filter(
          (p) => PMD[p.id] && !PDONE(p) && inScope(p.id),
        ).map((p) => pmStat(p.id));
        const risk = pm.filter((s) => s.light === "위험");
        if (risk.length)
          W.push([
            "bad",
            `위험 프로젝트 ${risk.length}건`,
            risk
              .map((s) => `${s.p.name} — ${s.R.find((r) => r[0] === "bad")[1]}`)
              .join(" · "),
            "UI-31",
            "프로젝트 현황판",
          ]);
        const ov = ISSUES.filter(
          (x) =>
            x.st !== "종료" &&
            x.due < TODAY &&
            !PDONE(PROJ_BY[x.proj]) &&
            inScope(x.proj),
        );
        if (ov.length)
          W.push([
            ov.some((x) => x.sev === "높음") ? "bad" : "warn",
            `기한 지난 이슈 ${ov.length}건`,
            `높음 ${ov.filter((x) => x.sev === "높음").length}건 · ${[...new Set(ov.map((x) => projName(x.proj)))].join(", ")}`,
            "UI-31",
            "프로젝트 현황판",
          ]);
        const BM = S.month || BASE;
        /* 고른 달 기준(SFR-116-01) */ const bb =
          MODE === "pm" ? [] : billBad(BM).filter((x) => inScope(x.p.id));
        if (bb.length)
          W.push([
            "bad",
            `${+BM.slice(5)}월 청구 누락 의심 ${bb.length}건`,
            `${kor(bb.reduce((s, x) => s + Math.max(0, x.diff), 0))} · ${bb.map((x) => x.p.name).join(", ")}`,
            "UI-13",
            "청구·입금",
          ]);
        const ap =
          MODE === "pm"
            ? []
            : OPPS.filter(
                (o) =>
                  o.status === "진행" &&
                  o.appr &&
                  o.appr.st === "승인 대기" &&
                  (MODE === "all" || myParts().includes(o.part)),
              );
        if (ap.length)
          W.push([
            "warn",
            `견적 승인 대기 ${ap.length}건`,
            ap.map((o) => `${o.name} (이익률 ${pct(o.appr.m)})`).join(" · "),
            "UI-29",
            "영업 파이프라인",
          ]);
        const stl = pm.filter((s) => s.stale);
        if (stl.length)
          W.push([
            "warn",
            `상태 업데이트 없음 ${stl.length}건`,
            "2주 넘게 주간 메모가 없음 · " +
              stl.map((s) => s.p.name).join(", "),
            "UI-31",
            "프로젝트 현황판",
          ]);
        return W;
      }

      let SESS_END = Date.now() + 30 * 60e3;

        const t = Math.max(0, Math.round((SESS_END - Date.now()) / 1000));

          String(Math.floor(t / 60)).padStart(2, "0") +

          String(t % 60).padStart(2, "0")

      }

      /* 2026-10-30 A26: 소속 파트 = 파트장인 파트·고른 본사 + 담당 프로젝트(종료 제외)의 영업 파트 */ function myInfoParts(
        u,
      ) {
        const ps = (u.parts || []).slice();
        (u.projs || []).forEach((id) => {
          const x = PROJ.find((q) => q.id === id);
          if (
            x &&
            !PDONE(x) &&
            x.part &&
            x.part !== "–" &&
            !ps.includes(x.part)
          )
            ps.push(x.part);
        });
        return ps;
      }

          title: "내 정보",

      function renderNav() {
        const coll = isCollapsed();
        const vis = (id) => !(isMobile() && PC_ONLY.includes(id)) && canSee(id);
        const g0 = MENU.find((g) => g.items.some((i) => i[0] === S.active));
        const openG = S.openG ?? g0?.g;
        let h = "";
        if (!coll) {
          const fv = S.favs.filter(vis);
          h += `<div class="nav-quick"><div class="nq-t">${ic("star", 14)} 즐겨찾기</div>${fv.length ? fv.map((id) => navLink(id, 1)).join("") : '<p class="nq-empty">화면 제목 옆 ☆를 누르면 추가됩니다.</p>'}<div class="nq-t">${ic("clock", 14)} 최근 본 화면</div>${
            S.recents
              .filter(vis)
              .slice(0, 5)
              .map((id) => navLink(id, 1))
              .join("") || '<p class="nq-empty">아직 없습니다.</p>'
          }</div>`;
        }
        h +=
          '<nav class="nav-tree" aria-label="업무 메뉴">' +
          MENU.map((g) => {
            const items = g.items.filter((i) => vis(i[0]));

            `철수일이 프로젝트 계약 종료일(${p.end})보다 늦습니다. 「프로젝트·투입 › 프로젝트」에서 계약 기간을 먼저 연장해 주세요.`;
        else if (dv && dv.retire && AS.end > dv.retire)
          e["as-s"] =
            `철수일이 ${dv.name}님의 퇴사일(${dv.retire})보다 늦습니다.`;
        if (!(mm > 0 && mm <= 1))
          e["as-r"] = "월 MM은 0보다 크고 1.00 이하로 넣어 주세요.";
        if (AS.kind === "대체투입" && !AS.orig)
          e["as-o"] = "계약상 인력을 골라 주세요.";
        if (showRate && !(+AS.rate > 0)) e["as-u"] = "청구 단가를 넣어 주세요.";
        if (Object.keys(e).length) {
          AS.err = e;
          DR.body = asgBody();
          renderDrawer();
          $("#" + Object.keys(e)[0])?.focus();
          return;
        }
        /* 2026-10-30 B17: 대체투입이면 계약상 인력의 이 프로젝트 배정 중 투입일에 걸친 것을 투입일 전날로 조기 철수할지 묻는다 */
        const sub =
          AS.kind === "대체투입" ? subTargets(p.id, AS.orig, AS.start) : [];
        if (sub.length) {
          const o = PEOPLE.find((x) => x.no === AS.orig),
            d = addDays(AS.start, -1);
          openModal({
            title: "대체투입 저장",
            body: `<p>${esc(o.name)}님의 「${esc(p.name)}」 배정을 <b>${d}</b>로 조기 철수합니다.</p><div class="fsec" id="sub-list">${sub.map((x) => `<label class="row" style="gap:8px"><input type="checkbox" data-sub="${x.id}" checked> ${x.start} ~ ${x.end} · 월 MM ${mmf(x.mm)} · ${x.kind}</label>`).join("")}</div>${d.slice(0, 7) <= S.closedTo ? `<div class="banner warn">${ic("warn", 16)}<span>마감한 달(${d.slice(0, 7)})에 걸칩니다. 마감한 달 금액은 그대로 두고 차액은 이번 달 전월 조정으로 넣습니다.</span></div>` : ""}${tkDistWarn(p, o) ? `<div class="banner warn">${ic("warn", 16)}<span>턴키 배분표는 다시 옮겨 올려 주셔야 합니다. 그 전까지는 배분 불일치 경고가 뜹니다.</span></div>` : ""}${fcF("sb-r", "철수 사유", `<select class="in" id="sb-r"><option value="">고르세요</option>${HREASON.map((x) => `<option>${x}</option>`).join("")}</select>`, "")}${fcF("sb-m", "메모", `<input class="in" id="sb-m" maxlength="200" value="대체투입(${esc(dv.name)})">`, "", 0)}<p class="errmsg" id="sb-e" role="alert"></p><p class="help">[대체투입만 저장]을 누르면 ${esc(o.name)}님 배정은 그대로 둡니다. 나중에 [변경 기록] › 조기 철수로 따로 처리할 수 있습니다.</p>`,
            buttons: [
              { l: "취소", fn: closeModal },
              {
                l: "대체투입만 저장",
                fn: () => {
                  closeModal();
                  asgCommit(dv, p, mm, showRate, []);
                },
              },
              {
                l: "같이 처리",
                cls: "btn-p",
                fn: () => {
                  const ids = [
                    ...document.querySelectorAll(
                      "#sub-list [data-sub]:checked",
                    ),
                  ].map((x) => x.dataset.sub);
                  const r = $("#sb-r").value,
                    m = $("#sb-m").value.trim();
                  if (ids.length && !r) {
                    $("#sb-e").textContent = "철수 사유를 골라 주세요.";
                    $("#sb-r").focus();
                    return;
                  }
                  closeModal();
                  asgCommit(
                    dv,
                    p,
                    mm,
                    showRate,
                    sub.filter((x) => ids.includes(x.id)),
                    r + (m ? ` · ${m}` : ""),
                  );
                },
              },
            ],
          });
          return;
        }
        asgCommit(dv, p, mm, showRate, []);
      };
      /* 2026-10-30 B17: 턴키이고 계산에 쓰는 배분표에 계약상 인력 줄이 있으면 배분표도 고치라고 안내(자동으로 바꾸지 않음) */ const tkDistWarn =
        (p, o) => {
          if (p.type !== "턴키") return false;
          const cur = distCur(p.id);
          return !!(
            cur && cur.rows.some((x) => x.kind === "사람" && x.name === o.name)
          );
        };
      const subTargets = (proj, no, start) =>
        ASSIGN.filter(
          (x) =>
            x.proj === proj &&
            x.p.no === no &&
            x.start < start &&
            x.end >= start,
        );
      function asgCommit(dv, p, mm, showRate, wd, rsn) {
        /* 2026-10-31 C7: 철수 사유는 투입 변경 사유 코드(HREASON)에서 고르고, 메모 기본값 「대체투입(B)」 */ const d =
          addDays(AS.start, -1);
        wd.forEach((x) => {
          logHist(
            x,
            "조기 철수",
            `종료 ${x.end}`,
            `철수 ${d}`,
            rsn || `기타 · 대체투입(${dv.name})`,
            d,
          );
          x.end = d;
        });
        const id = "A-" + String(9100 + ASSIGN.length);
        const a = {
          id,
          p: dv,
          proj: p.id,
          job: AS.job,
          start: AS.start,
          end: AS.end,
          mm: r2(mm),
          rate: AS.kind === "무상지원" ? 0 : showRate ? +AS.rate : dv.rate || 0,
          ext: null,
          kind: AS.kind,
          orig: AS.orig || null,
        };
        a.hist = [
          {
            id: id + "-H01",
            type: "투입",
            date: a.start,
            from: "",
            to: `종료 ${a.end} · ${showRate ? "월 " + won(a.rate) + "원 · " : ""}월 MM ${mmf(a.mm)} · ${a.kind}${a.orig ? " (계약상 인력 " + PEOPLE.find((x) => x.no === a.orig).name + ")" : ""}`,
            reason: "",
            retro: a.start < TODAY,
            by: V14_USER,
            at: nowStr(),
            fixed: null,
          },
        ];
        ASSIGN.push(a);
        const w = warnOf(a);
        closeDrawer();
        AS = null;
        S.hl = id;
        setTimeout(() => {
          S.hl = null;
        }, 6000);
        renderPage();
        toast(
          `배정을 저장했습니다. 변경 이력에 「투입」 1줄을 남겼습니다.${wd.length ? ` ${wd[0].p.name}님 배정 ${wd.length}건을 ${d}로 조기 철수했습니다.` : ""}${
            a.orig &&
            tkDistWarn(
              p,
              PEOPLE.find((x) => x.no === a.orig),
            )
              ? " 턴키 배분표는 다시 옮겨 올려 주셔야 합니다."
              : ""
          }${w.length ? " 경고: " + w.join(", ") : ""}`,
        );
      }

      /* 인원 계획 (SFR-101-11, 식-67) */
      const PLAN = {};
      const projMonths = (p) => monthsOf(p.start, p.end).length;
      const needPlan = (o, p) => {
        const r = {};
        o.needs.forEach((x) => {
          const j = x.job || x[0],
            n = x.n ?? x[1];
          r[j] = r2(
            (r[j] || 0) + n * (x.mm || 1) * (x.months || projMonths(p)),
          );
        });
        return r;
      };
      const asgTotal = (a) =>
        r2(monthsOf(a.start, a.end).reduce((s, m) => s + mmIn(a, m), 0));
      function planRows(id, draft) {
        const act = {};
        ASSIGN.filter((a) => a.proj === id).forEach(
          (a) => (act[a.job] = r2((act[a.job] || 0) + asgTotal(a))),
        );
        const pl = draft || PLAN[id] || {};
        const order = Object.keys(JOBS);
        return [...new Set([...Object.keys(act), ...Object.keys(pl)])]
          .sort((a, b) => order.indexOf(a) - order.indexOf(b))
          .map((j) => ({
            j,
            plan: pl[j] === "" || pl[j] == null ? 0 : +pl[j],
            act: act[j] || 0,
          }));
      }
      const gapBadge = (plan, act) => {
        plan = plan || 0;
        const d = r2(act - plan);
        return d < 0
          ? badge("부족 " + Math.abs(d).toFixed(2), "bad")
          : d > 0
            ? badge("초과 " + d.toFixed(2), "warn")
            : badge("맞음", "ok");
      };
      /* 2026-10-31 F3: 계획 MM 수정은 그 프로젝트의 PM과 관리자만(SFR-101-11). 다른 사람은 보기만 */
      function canPlanMe(id) {
        if (isAdminMe()) return true;
        return (
          (ME.roles || [ME.role]).includes("일반 사용자(PM)") &&
          (ME.projs || []).includes(id)
        );
      }
      function planHtml(id) {
        const p = PROJ_BY[id],
          noPerm = !canPlanMe(id),
          ro = PDONE(p) || noPerm;
        const d = DR && DR.proj === id ? DR.planDraft : null;
        const rows = planRows(id, d);
        const used = new Set(rows.map((r) => r.j));
        const left = Object.entries(JOBS).filter(([k]) => !used.has(k));
        const tp = rows.reduce((s, r) => s + (r.plan || 0), 0),
          ta = rows.reduce((s, r) => s + r.act, 0);
        return (
          `<p class="cap">계획 MM은 프로젝트 전체 기간(${p.start.slice(0, 7)} ~ ${p.end.slice(0, 7)}, ${projMonths(p)}개월)의 직무별 합계입니다. 실제 MM은 이 프로젝트 투입 배정의 월 MM을 모두 더한 값(예정 포함)이라 자동으로 채워집니다.</p><div class="banner info" style="margin:6px 0">${ic("info", 16)}<span>계획보다 모자라는 MM(미충원)은 인력 수요 예측의 필요 인력에 잡힙니다. 더 투입하지 않으면 계획 MM을 실제에 맞게 줄여 주세요.</span></div>` +
          (rows.length
            ? `<div class="twrap free"><table class="t"><thead><tr><th>직무</th><th class="num">계획 MM</th><th class="num">실제 MM</th><th>차이</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${JOBS[r.j]}</td><td class="num">${ro ? mmf(r.plan) : `<input class="in in-sm" data-plan="${r.j}" value="${r.plan == null ? "" : r.plan}" placeholder="입력" inputmode="decimal" style="width:90px;text-align:right" aria-label="${JOBS[r.j]} 계획 MM">`}</td><td class="num">${mmf(r.act)}</td><td>${gapBadge(r.plan, r.act)}</td></tr>`).join("")}</tbody><tfoot><tr><td>합계</td><td class="num">${mmf(tp)}</td><td class="num">${mmf(ta)}</td><td></td></tr></tfoot></table></div>`
            : '<p class="sub">투입 배정과 계획이 아직 없습니다. [직무 추가]로 계획을 먼저 넣을 수 있습니다.</p>') +
          (ro
            ? ""
            : `<div class="row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px"><select class="in in-sm" id="pl-add" aria-label="추가할 직무" style="width:180px">${left.map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><button class="btn btn-sm" data-act="planadd" data-id="${id}" ${left.length ? "" : "disabled"}>${ic("plus", 14)} 직무 추가</button><span style="flex:1"></span>${d ? `<span class="cap">저장하지 않은 변경이 있습니다</span><button class="btn btn-sm" data-act="plancancel" data-id="${id}">취소</button>` : ""}<button class="btn btn-sm btn-p" data-act="plansave" data-id="${id}" ${d ? "" : "disabled"}>저장</button></div>`) +
          `<p class="note">처음에는 비어 있습니다. 사람을 보내기 전에 「부족」이 뜨는 것은 정상입니다(아직 투입하지 않았다는 표시). 범위가 줄면 계획 MM을 고쳐 맞춥니다. 차이는 허용 오차 없이 0일 때만 「맞음」입니다. 수정은 이 프로젝트의 PM(${esc(pmOf(id))})과 관리자만 할 수 있습니다.${noPerm && !PDONE(p) ? " <strong>지금은 보기만 할 수 있습니다.</strong>" : ""}</p>`
        );
      }
      const refreshPlan = (id) => {
        if (!DR || !DR.tabs) return;
        const k = DR.tabs.findIndex((t) => t.t === "인원 계획");
        if (k >= 0) {
          DR.tabs[k].html = planHtml(id);
          renderDrawer();
        }
      };

      /* 턴키 배분표 (SFR-101-10, 식-53·54) */
      const DSTG = ["견적", "최종 계약", "실제 투입계획"],
        DIST = {};
      function distSeed(id, stage, off, at) {
        const p = PROJ_BY[id];
        const ms = monthsOf(p.start, p.end);
        const as = ASSIGN.filter((a) => a.proj === id);
        const tot = p.amt - off;
        const item = Math.round((tot * 0.06) / 1e4) * 1e4;
        const ppl = tot - item;
        const w = as.map((a) => asgTotal(a) || 0.01);
        const ws = w.reduce((s, x) => s + x, 0) || 1;
        const rows = as.map((a) => ({ name: a.p.name, kind: "사람", m: {} }));
        as.forEach((a, i) => {
          const amt = Math.round((ppl * w[i]) / ws / 1e4) * 1e4;
          const am = monthsOf(
            a.start < p.start ? p.start : a.start,
            a.end > p.end ? p.end : a.end,
          );
          if (!am.length) return;
          const per = Math.floor(amt / am.length / 1e4) * 1e4;
          am.forEach(
            (m, k) =>
              (rows[i].m[m] =
                k === am.length - 1 ? amt - per * (am.length - 1) : per),
          );
        });
        const ir = { name: "기술료", kind: "항목", job: "", m: {} };
        const per = Math.floor(item / ms.length / 1e4) * 1e4;
        ms.forEach(
          (m, k) =>
            (ir.m[m] =
              k === ms.length - 1 ? item - per * (ms.length - 1) : per),
        );
        rows.push(ir);
        const sum = rows.reduce(
          (s, r) => s + Object.values(r.m).reduce((a, b) => a + b, 0),
          0,
        );
        ir.m[ms[ms.length - 1]] += tot - sum;
        return {
          stage,
          at: at || TODAY,
          by: V14_USER,
          file: `배분표_${p.id}_${stage}.xlsx`,
          rows,
        };
      }
      const distCur = (id) => {
        const u = (DIST[id] || {}).ups || [];
        return u.reduce(
          (b, x) =>
            !b || DSTG.indexOf(x.stage) >= DSTG.indexOf(b.stage) ? x : b,
          null,
        );
      };
      function distHtml(id) {
        const p = PROJ_BY[id],
          cur = distCur(id),
          ups = (DIST[id] || {}).ups || [];
        const ro = PDONE(p);
        const head = `<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn btn-sm" data-act="disttpl" data-id="${id}">${ic("down", 14)} 양식 받기</button>${ro ? "" : `<button class="btn btn-sm btn-p" data-act="distup" data-id="${id}">${ic("up", 14)} 엑셀 업로드</button>`}<span class="cap">화면에서 칸을 직접 고치지 않고, 고친 엑셀을 다시 올립니다. PC 전용.</span></div>`;
        if (!cur)
          return (
            head +
            `<div class="empty" style="padding:24px 0"><p>아직 올린 배분표가 없습니다.</p><p class="cap">견적 → 최종 계약 → 실제 투입계획 순서로 올릴 수 있고, 계산에는 가장 나중 단계의 표를 씁니다. 올리기 전에는 「그 달 원가 × (계약금액 ÷ 예산)」으로 매출을 잡습니다.</p></div>`
          );
        const ms = monthsOf(p.start, p.end);
        const rs = (r) => Object.values(r.m).reduce((a, b) => a + b, 0);
        const tot = cur.rows.reduce((s, r) => s + rs(r), 0);
        const diff = tot - p.amt;
        const colT = ms.map((m) =>
          cur.rows.reduce((s, r) => s + (r.m[m] || 0), 0),
        );
        return (
          head +
          `<p style="margin:12px 0 6px"><strong>계산에 쓰는 표</strong> ${badge(cur.stage, "info")} <span class="cap">${cur.at} · ${esc(cur.by)} · ${esc(cur.file)}</span></p>` +
          (diff
            ? `<div class="banner warn">${ic("warn", 16)}<span>배분표 합계 ${won(tot)}원이 계약금액 ${won(p.amt)}원보다 <strong>${won(Math.abs(diff))}원 ${diff > 0 ? "많습니다" : "적습니다"}</strong>. 저장은 되었고, 1원이라도 다르면 이렇게 알립니다.</span></div>`
            : `<div class="banner info">${ic("okc", 16)}<span>합계가 계약금액과 같습니다.</span></div>`) +
          (() => {
            const mis = distMis(id);
            return mis.length
              ? `<div class="banner warn">${ic("warn", 16)}<span><strong>투입 배정과 안 맞는 곳 ${mis.length}건</strong>이 있습니다. 배정이 바뀌었다면 실제 투입계획 배분표를 다시 올려 주세요. 계산은 지금 표대로 합니다.</span></div><div class="twrap free" style="margin:6px 0 12px"><table class="t"><thead><tr><th>사람</th><th>구분</th><th>해당 월</th><th>설명</th></tr></thead><tbody>${mis.map((x) => `<tr><td>${esc(x.name)}</td><td>${badge(x.type, "warn")}</td><td>${msRange(x.ms)}</td><td class="cap">${x.why}</td></tr>`).join("")}</tbody></table></div>`
              : `<div class="banner info">${ic("okc", 16)}<span>투입 배정과 사람·월이 모두 맞습니다.</span></div>`;
          })() +
          `<div class="twrap free"><table class="t"><thead><tr><th class="sc">사람·항목</th><th>구분</th>${ms.map((m) => `<th class="num">${m.slice(2).replace("-", ".")}</th>`).join("")}<th class="num">합계</th></tr></thead><tbody>${cur.rows
            .map(
              (r) =>
                `<tr><td class="sc">${esc(r.name)}${(() => {
                  const j = r.kind === "사람" ? distJob(id, r.name) : r.job;
                  return j ? ` <span class="cap">${esc(j)}</span>` : "";
                })()}</td><td>${badge(r.kind, r.kind === "사람" ? "neutral" : "info")}</td>${ms.map((m) => `<td class="num">${r.m[m] ? won(r.m[m]) : '<span class="sub">–</span>'}</td>`).join("")}<td class="num"><strong>${won(rs(r))}</strong></td></tr>`,
            )
            .join(
              "",
            )}</tbody><tfoot><tr><td class="sc">합계</td><td></td>${colT.map((v) => `<td class="num">${won(v)}</td>`).join("")}<td class="num"><strong>${won(tot)}</strong></td></tr></tfoot></table></div>` +
          `<p class="note">단위: 원. 기술료·컨설팅비 같은 항목 줄은 프로젝트 매출에는 넣고 개인 단가에서는 뺍니다(식-53).</p>` +
          `<h3 style="font-size:14px;margin:16px 0 6px">올린 기록 (${ups.length})</h3><div class="twrap free"><table class="t"><thead><tr><th>올린 날</th><th>단계</th><th>파일</th><th>올린 사람</th><th></th></tr></thead><tbody>${ups
            .slice()
            .reverse()
            .map(
              (u) =>
                `<tr><td>${u.at}</td><td>${badge(u.stage)}</td><td>${esc(u.file)}</td><td>${esc(u.by)}</td><td>${u === cur ? badge("계산에 사용", "ok") : ""}</td></tr>`,
            )
            .join("")}</tbody></table></div>`
        );
      }
      const refreshDist = (id) => {
        if (S.dist === id) renderAll();
      };
      /* 배분표 전체 화면: 프로젝트 목록 [배분표] 칸에서 연다 (2026-10-22 결정) */
      function distDiff(id) {
        const p = PROJ_BY[id],
          cur = distCur(id);
        if (!cur) return 0;
        return (
          cur.rows.reduce(
            (s, r) => s + Object.values(r.m).reduce((a, b) => a + b, 0),
            0,
          ) - p.amt
        );
      }
      /* 배분표 ↔ 투입 배정 불일치 (2026-10-24): 이름·월 기준. 저장은 막지 않고 알리기만 한다 */
      function msRange(ms) {
        const out = [];
        let st = null,
          pv = null;
        const nx = (m) => {
          let [y, mo] = m.split("-").map(Number);
          mo++;
          if (mo > 12) {
            mo = 1;
            y++;
          }
          return y + "-" + String(mo).padStart(2, "0");
        };
        ms.forEach((m) => {
          if (st && nx(pv) === m) {
            pv = m;
            return;
          }
          if (st) out.push([st, pv]);
          st = pv = m;
        });
        if (st) out.push([st, pv]);
        const f = (m) => m.slice(2).replace("-", ".");
        return out
          .map(([a, b]) => (a === b ? f(a) : f(a) + "~" + f(b)))
          .join(", ");
      }
      function distMis(id) {
        const p = PROJ_BY[id],
          cur = distCur(id);
        if (!cur) return [];
        const ms = monthsOf(p.start, p.end);
        const as = ASSIGN.filter((a) => a.proj === id);
        const res = [];
        const ppl = cur.rows.filter((r) => r.kind === "사람");
        ppl.forEach((r) => {
          const bad = ms.filter(
            (m) =>
              (r.m[m] || 0) > 0 &&
              !as.some((a) => a.p.name === r.name && mmIn(a, m) > 0),
          );
          if (bad.length)
            res.push({
              name: r.name,
              type: "배정 없음",
              ms: bad,
              why: "배분표에는 금액이 있는데 그 달 투입 배정이 없습니다.",
            });
        });
        [...new Set(as.map((a) => a.p.name))].forEach((n) => {
          if (ppl.some((r) => r.name === n)) return;
          const bad = ms.filter((m) =>
            as.some((a) => a.p.name === n && mmIn(a, m) > 0),
          );
          if (bad.length)
            res.push({
              name: n,
              type: "배분표 없음",
              ms: bad,
              why: "투입 배정은 있는데 배분표에 줄이 없어 「그 달 원가 × 계약금액 ÷ 예산」으로 계산합니다.",
            });
        });
        return res;
      }
      function distCell(id) {

        if (p.type !== "턴키") return '<span class="sub">–</span>';

            rows.push({

      });
      (function () {

      DIST["P-2602"] = {

        if (s[0] === "g") {
          const a = +s.slice(1),
            b = t[0] === "g" ? +t.slice(1) : +t.split(".")[0];
          if (a === b) return;
          const [g] = MED.splice(a, 1);
          MED.splice(b, 0, g);
          MED_DIRTY = true;
          renderPage();
          return;
        }
        const [gi, ii] = s.split(".").map(Number);
        const it = MED[gi].items[ii];
        let tg, ti;
        if (t[0] === "g") {
          tg = +t.slice(1);
          ti = MED[tg].items.length;
        } else [tg, ti] = t.split(".").map(Number);
        if (tg !== gi && it.lock) {
          toast(
            `「${it.n}」은 시스템 묶음 메뉴라 다른 묶음으로 옮길 수 없습니다.`,
            "info",
          );
          return;
        }
        MED[gi].items.splice(ii, 1);
        if (tg === gi && t[0] === "g") ti = MED[tg].items.length;
        MED[tg].items.splice(Math.min(ti, MED[tg].items.length), 0, it);
        MED_DIRTY = true;
        renderPage();
        if (tg !== gi)
          toast(
            `「${it.n}」을 「${MED[tg].g}」 묶음으로 옮겼습니다. 저장해야 반영됩니다.`,
