components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    YesNo:
      type: string
      enum:
      - Y
      - N
      description: 원문 Y/N 값. boolean으로 대체하지 않는다.
    ChangeType:
      type: string
      enum:
      - NEW
      - UPD
      - STOP
      - RESUME
      - DEL
      description: 등록·값변경·중지·재개·삭제 이력 유형.
    PreferenceType:
      type: string
      enum:
      - FAV
      - RECENT
      - MENU_FOLD
      - PAGE_SIZE
      - DENSE
      - COLS
      - AMT_UNIT
      - PERIOD
      description: 원문 PREF_TYPE_CD 값.
    Revision:
      type: string
      description: 식별자·저장값·REG_DTTM/MOD_DTTM에 근거한 불투명 토큰. 시각 양NULL도 값 변경이면 달라진다. 물리 version 컬럼은 추가하지 않는다.
      minLength: 1
    YearMonth:
      type: string
      description: 0001-01~9999-12 실제 연월. 날짜 라이브러리로 월 가감한다.
      pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$
    GroupId:
      type: string
      description: trim·대문자 정규화 후 검사. 등록 식별자는 불변.
      minLength: 1
      maxLength: 30
      pattern: ^[A-Z][A-Z0-9_]{0,29}$
    CodeId:
      type: string
      description: trim·대문자 정규화 후 검사. 등록 PK는 불변.
      minLength: 1
      maxLength: 20
      pattern: ^[A-Z0-9_]{1,20}$
    DecimalValue:
      type: string
      description: 정규화된 응답 십진 문자열. 0~99999999999.9999, 정수부 최대11·소수 최대4. BigDecimal, 반올림·버림·float/double 변환0회. 별도 제한 없는 %에는100
        상한을 추가하지 않는다.
      pattern: ^[0-9]{1,11}(\.[0-9]{1,4})?$
    DecimalInput:
      type: string
      description: 원문 숫자 입력 문자열. 공백·쉼표·끝 원/% 제거 후 DecimalValue 범위로 검사한다. 음수·지수·NaN·Infinity·다른 문자·정수12자리·소수5자리400. JSON number
        거부. 기준 빈값400; 신규/비운 수당은0. 패턴은 정리 전 입력을 막지 않으며 서비스에서 정규화·검사한다.
    ResponseMeta:
      type: object
      properties: {}
      additionalProperties: false
      required: []
      description: 봉투의 meta는 필수이나 내부 필드는 원문 미정이다. 비어 있는 meta를 허용하는 제안이며 승인 전 OQ-003이다. 업무 data 대체물이 아니다.
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: true
      required:
      - success
      - meta
      description: 공통 성공 봉투. 약속된 data는 연산별 응답의 allOf로 구체화한다.
    ErrorDetails:
      type: object
      properties:
        references:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: 참조 유형
              count:
                type: integer
                minimum: 0
            additionalProperties: false
            required:
            - type
            - count
        violations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
                description: 한국어 필드 사유
            additionalProperties: false
            required:
            - field
            - message
      additionalProperties: false
      required: []
      description: 참조 유형/건수·필드별 오류의 구조화 제안. 내부 명명은 OQ-003 승인 대기. SQL·스택·비밀값은 없다.
