server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: sicost
  datasource:
    url: ${DB_URL:jdbc:postgresql://database:5432/sicost}
    username: ${DB_USER:sicost}
    password: ${DB_PASSWORD:dev-only-password}
    hikari:
      connection-timeout: 3000
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  flyway:
    enabled: true
    group: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Seoul
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
logging:
  level:
    org.flywaydb: WARN
    com.zaxxer.hikari: OFF
    org.mybatis: WARN
