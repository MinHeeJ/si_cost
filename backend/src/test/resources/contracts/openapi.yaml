      pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])-[0-9]{2} [0-9]{2}:[0-9]{2}$
      description: Asia/Seoul YYYY-MM-DD HH:mm 표시; revision은 표시 시각이 아니라 원 timestamp 정밀도/NULL을 사용한다.
