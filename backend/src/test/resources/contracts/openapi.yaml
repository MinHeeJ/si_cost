      type: string
      description: JSON 문자열만. 공백·쉼표·끝의 원 제거 후 숫자만; 0~999999999999999원 포함. 소수/음수/지수/NaN/Infinity/다른 문자400. BigDecimal로
        무반올림 검사한다.
