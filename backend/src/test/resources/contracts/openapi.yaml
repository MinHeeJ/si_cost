      type: string
      pattern: ^(?:0*(?:100(?:\.0{1,2})?|(?:[0-9]|[1-9][0-9])(?:\.[0-9]{1,2})?))$
      description: 십진 문자열·0~100 포함·최대 소수2자리. 부호/지수/NaN/Infinity/문자/초과 소수400; BigDecimal 무반올림.
