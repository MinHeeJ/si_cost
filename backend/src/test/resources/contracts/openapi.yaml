      - 'REQ-453: 소속 선택은 필수이며 자사는 NULL, 협력사는 사용 중 VNDR/BOTH다. OS는 협력사 필수이고 나머지는 자사 가능하다. partId는 기본선택 없는 필수값으로 사용
        중 영업 파트/HQ 및 예정 시작 파트를 허용한다.'
      - 'REQ-455: 등록 USE_YN=Y·근무 상태는 5.3으로 산출한다. 입사일이 있는 이름+입사일 중복은 기존 관리번호와 경고를 보여도 저장 허용하며 관리번호 중복만 거부한다.'
      - 'REQ-457: 등록 시 입사월, 입사일 없으면 서버 현재월로 첫 가격 행을 생성하며 두 금액 모두 NULL이어도 생성한다. 종료월은 NULL이고 월 단가·월 급여는 독립 선택값이다.'
      - 'REQ-460: 현재월 마감이면 금액 변경은 409 CLOSED_MONTH지만 다른 기본정보 수정은 허용한다. 최초 이관용 등록/B8 입사월은 과거여도 허용하고 과거 급여·마감을 재계산하지
        않는다.'
