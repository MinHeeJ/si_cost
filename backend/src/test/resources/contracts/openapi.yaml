      - 'REQ-507: B8은 신규 등록 전용으로 중복 관리번호로 기존 사람을 수정/재개하지 않는다. 대상월/프로젝트·마감월/지난해 제한은 없고 급여 B1 양식은 추가하지 않는다.'
      - 'REQ-509: 소속은 자사 또는 정규화 사업자번호로 찾으며 협력사 이름은 사용 중 VNDR/BOTH 정확히1개일 때만 허용한다. 중복 이름은 사업자번호 사용 안내·ERR, 자사는 companyId=NULL이나
        OS에서는 거부한다.'
      - 'REQ-510: 사용 중 PART_NM 또는 본사/본사(직접 영업)/HQ를 식별해 PART_ID로 저장한다.'
      - 'REQ-511: 코드 칸은 활성 CODE_NM 일치→같은 그룹 CODE_MAP.SRC_TEXT 일치→ERR 순이다. 이전 표기 대응은 WARN, 복수 이름/중지/삭제는 ERR, 코드ID를
