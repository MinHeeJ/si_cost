      - 'REQ-452: 관리번호는 선택, 정규식 ^[A-Za-z0-9-]{1,20}$이며 대소문자를 보존·구분한다. 빈칸은 K-nnnn 자동 발급, 중지/퇴사자까지 중복은 409 DUPLICATE_MANAGEMENT_NO,
